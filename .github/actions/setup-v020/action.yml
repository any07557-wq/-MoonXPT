name: Fixed MoonXPT v0.2.0 validation environment
description: Install the pinned official native SDK and optional pinned development oracles
inputs:
  oracles:
    description: Install independent development oracle families
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.14.4'
    - name: New fixed SDK
      shell: bash
      run: |
        set -euo pipefail
        moonxpt_sdk_dir="$RUNNER_TEMP/moon-sdk-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
        python3 tools/install_toolchain.py "$moonxpt_sdk_dir" --receipt "$RUNNER_TEMP/sdk-install.json"
        echo "$moonxpt_sdk_dir/bin" >> "$GITHUB_PATH"
        echo "MOON_HOME=$moonxpt_sdk_dir" >> "$GITHUB_ENV"
        echo "MOONXPT_SDK_RECEIPT=$RUNNER_TEMP/sdk-install.json" >> "$GITHUB_ENV"
    - name: Pinned oracle dependencies
      if: inputs.oracles == 'true'
      shell: bash
      run: |
        set -euo pipefail
        python3 -m venv .cache/venv
        .cache/venv/bin/python -m pip --isolated install --no-cache-dir --index-url https://pypi.org/simple -r tools/requirements-oracle.txt
        .cache/venv/bin/python -m pip --isolated install --no-cache-dir --index-url https://pypi.org/simple --no-deps xport==3.6.1
