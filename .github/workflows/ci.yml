name: MoonXPT compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_corpus:
        description: Download hash-pinned CDC corpus and run independent oracles
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.4'
      - name: Fresh SDK, build and offline tests
        run: python3 tools/verify_release.py --mode offline --evidence-dir "$RUNNER_TEMP/moonxpt-evidence"
      - name: Preserve verification evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/moonxpt-evidence/
          if-no-files-found: error
          retention-days: 30
  public-corpus:
    if: github.event_name == 'workflow_dispatch' && inputs.real_corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.4'
      - name: Fresh SDK, oracles and hash-pinned public corpus
        run: python3 tools/verify_release.py --mode full --evidence-dir "$RUNNER_TEMP/moonxpt-evidence"
      - name: Preserve verification evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/moonxpt-evidence/
          if-no-files-found: error
          retention-days: 30
